<modal-ui id="modal-gps-tiempo-real" aria-labelledby="titulo-modal-gps-tiempo-real"
    aria-describedby="mensaje-modal-gps-tiempo-real">
    <contenedor-ui class="cabecera-modal">
        <h2 id="titulo-modal-gps-tiempo-real">Ubicación en tiempo real</h2>
        <boton-ui tipo="button" variante="cerrar" data-cerrar-modal aria-label="Cerrar diálogo">&times;</boton-ui>
    </contenedor-ui>
    <p id="mensaje-modal-gps-tiempo-real" class="texto-ayuda">
        Para transmitir la ubicación se requiere GPS de alta precisión.
    </p>
    <div class="acciones-modal">
        <boton-ui id="boton-autorizar-gps-tiempo-real" tipo="button" variante="principal" ancho="completo">
            <span id="texto-boton-autorizar-gps-tiempo-real">Autorizar GPS</span>
        </boton-ui>
    </div>
</modal-ui>
