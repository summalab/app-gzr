<main class="contenedor-principal" aria-label="Mapa de ubicaciones">
    <div id="mapa-interactivo" role="application" aria-label="Mapa interactivo"></div>
    <div id="indicador-vista-mapa" class="indicador-vista" data-texto="vistaPublica">Vista pública</div>

    <seccion-botones-fab id="seccion-botones-flotantes" class="orden-vertical">
        <boton-ui id="boton-seguimiento-ubicacion" tipo="button" variante="flotante"
            class="boton-seguimiento-flotante oculto" aria-label="Activar ubicación en tiempo real"
            title="Activar ubicación en tiempo real" aria-pressed="false">
            ◎
        </boton-ui>
        <boton-ui id="boton-nueva-ubicacion" tipo="button" variante="flotante" aria-label="Agregar ubicación" class="oculto"
            title="Agregar ubicación" data-aria-texto="agregarUbicacion" data-titulo-texto="agregarUbicacion">
            +
        </boton-ui>
    </seccion-botones-fab>
</main>
