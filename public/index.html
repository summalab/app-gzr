<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Peligro Estructural Inminente</title>
    <script>
        (() => {
            const preferencia = (() => {
                try {
                    const guardado = localStorage.getItem('preferencia-tema');
                    return ['claro', 'oscuro', 'sistema'].includes(guardado) ? guardado : 'sistema';
                } catch {
                    return 'sistema';
                }
            })();
            const tema = preferencia === 'sistema'
                ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro')
                : preferencia;
            document.documentElement.dataset.tema = tema;
            document.documentElement.dataset.preferenciaTema = preferencia;
            document.documentElement.style.colorScheme = tema;
        })();
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="css/tema-claro.css">
    <link rel="stylesheet" href="css/tema-oscuro.css">
    <link rel="stylesheet" href="css/estructura-general.css">
</head>

<body>
    <div data-componente="componentes/navegacion.html"></div>
    <div data-componente="componentes/alerta-global.html"></div>
    <div data-componente="componentes/mapa.html"></div>
    <div data-componente="componentes/panel-cuenta.html"></div>
    <div data-componente="componentes/modales-autenticacion.html"></div>
    <div data-componente="componentes/modales-cuenta.html"></div>
    <div data-componente="componentes/modal-ubicacion.html"></div>
    <div data-componente="componentes/modal-gps-tiempo-real.html"></div>
    <div data-componente="componentes/modal-configuracion-tiempo-real.html"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module" src="js/AppInitializer.js"></script>
</body>

</html>
